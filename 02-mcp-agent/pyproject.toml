[project]
name = "02-mcp-agent"
version = "0.1.0"
description = "An agent that loads tools from MCP servers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.60.0",
    "python-dotenv>=1.0.0",
    "mcp[cli]>=1.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]